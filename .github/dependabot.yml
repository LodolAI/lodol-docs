version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    groups:
      # fumadocs-ui requires the fumadocs-core of its exact version, and newer
      # fumadocs-mdx requires a newer fumadocs-core, so bumping any one of them
      # alone fails `npm ci`. Bump them together in one PR.
      fumadocs:
        patterns:
          - "fumadocs-*"
