name: Test that the docs site builds without issue

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: read
  statuses: write # For status checks

jobs:
  test-build-docs:
    name: Test that the docs site builds without issue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      # The runner has 16 GB of memory, and compiling the site's ~790 pages
      # uses most of it. Swap gives the build room past that at its peak,
      # instead of the runner running out and being shut down mid-build.
      - name: Add swap space
        run: |
          sudo fallocate -l 16G /mnt/build-swap
          sudo chmod 600 /mnt/build-swap
          sudo mkswap /mnt/build-swap
          sudo swapon /mnt/build-swap
          free -h

      - name: Build docs
        run: npm run build
