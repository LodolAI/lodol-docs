name: Deploy the Docs live

on:
  push:
    branches: ["main"]

env:
  REGION: us-west1
  SERVICE: docs
  IMAGE: us-west1-docker.pkg.dev/skipflow/docs-repo/docs
  PORT: 3000
  SITE_URL: https://docs.lodol.com

jobs:
  deploy-docs:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Auth with GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      # Tag by commit as well as latest, so every deployed revision maps back to
      # the exact image that produced it and can be redeployed as-is.
      - name: Build & push Docker image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      # Note the revision serving before this deploy, so a failed deploy can be
      # rolled back with a single command from the job log.
      - name: Note the revision currently serving
        id: previous
        run: |
          set -euo pipefail
          PREVIOUS="$(
            gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
              | jq -r '[.status.traffic[] | select((.percent // 0) > 0) | .revisionName] | first // empty'
          )"
          echo "revision=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Currently serving: ${PREVIOUS:-none}"

      # The deploy states the resources the service needs instead of inheriting
      # Cloud Run's defaults. Measured against the 575-provider catalog: the
      # server holds ~460 MB resident after boot and ~825 MB once the search
      # index is built, well past the 512 MiB default limit that was killing
      # every instance and leaving the site serving nothing but 503s.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$GITHUB_SHA" \
            --region "$REGION" \
            --platform managed \
            --port "$PORT" \
            --service-account=941033595490-compute@developer.gserviceaccount.com \
            --memory 2Gi \
            --cpu 2 \
            --cpu-boost \
            --min-instances 1 \
            --max-instances 10 \
            --concurrency 40 \
            --timeout 60s \
            --quiet

      # A deploy is not a success until the site actually serves pages. Cloud
      # Run's own startup probe only checks that the port opens, which Next does
      # in milliseconds before the app does any work -- that is why this job kept
      # reporting success while docs.lodol.com was returning 503 to everyone.
      #
      # This checks the public site, because the service's run.app URL is not
      # externally reachable (it answers 404 at the Google Frontend), so there is
      # no address that reaches a revision before it takes traffic.
      - name: Check the site is actually serving
        run: |
          set -euo pipefail

          echo "Checking $SITE_URL"

          # Retried so a cold start is not mistaken for a broken deploy, but a
          # revision that cannot serve fails every attempt.
          check() {
            path="$1"
            code=000
            for attempt in $(seq 1 10); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$SITE_URL$path" || echo 000)"
              if [ "$code" = "200" ]; then
                echo "  ok   $path"
                return 0
              fi
              echo "  $code  $path (attempt $attempt/10)"
              sleep 10
            done
            echo "::error::$path returned $code -- the site is not serving."
            return 1
          }

          # The landing page, the heaviest docs page, and the search endpoint --
          # between them they load everything that has to fit in memory.
          if check "/" && check "/docs/api-reference/actions" && check "/api/search?query=slack"; then
            echo "The docs are serving."
            exit 0
          fi

          PREVIOUS="${{ steps.previous.outputs.revision }}"
          if [ -n "$PREVIOUS" ]; then
            echo "::error::To put the previous revision back:"
            echo "::error::  gcloud run services update-traffic $SERVICE --region $REGION --to-revisions=$PREVIOUS=100"
          fi
          exit 1
